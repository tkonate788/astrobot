version: '3.8'

# ── AstroBot Docker Compose ─────────────────────────────────────
# Connects to an external n8n network where the PostgreSQL
# container (postgre_container) already lives.
#
# Secrets are read from a `.env` file next to this compose file.
# Copy `.env.example` to `.env` and fill in real values before deploying.

services:
  astrobot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: astrobot
    image: astrobot:2.0.0

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - N8N_WEBHOOK=${N8N_WEBHOOK}
      - HF_API_KEY=${HF_API_KEY}
      # Optional: Groq for Whisper audio transcription. Free key at https://console.groq.com/keys
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Admin seed credentials (used on first DB init)
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

    networks:
      - n8n_container_n8n-net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Admin Dashboard (separate service on port 7040) ──────────────
  astrobot-admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    container_name: astrobot-admin
    image: astrobot-admin:1.0.0

    ports:
      - "7040:7040"

    environment:
      - NODE_ENV=production
      - PORT=7040
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

    networks:
      - n8n_container_n8n-net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7040/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ── Networks ────────────────────────────────────────────────────
networks:
  n8n_container_n8n-net:
    external: true
    # This network is created and managed by the n8n docker-compose stack.
    # Ensure n8n is running and this network exists before deploying AstroBot.
