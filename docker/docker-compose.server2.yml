# ── AstroBot — Server 2 (77.37.120.217) Docker Compose ──────────────
# Single origin/port for everything:
#   - Main app published on host port 3000  -> http://<host>:3000/
#   - Admin dashboard on the SAME port under -> http://<host>:3000/admin
#     (the main app reverse-proxies /admin/* to astrobot-admin:7040)
#   - Also served over HTTPS by the host's Caddy:
#       https://astrobot.77-37-120-217.sslip.io/       -> astrobot:3000
#       https://astrobot.77-37-120-217.sslip.io/admin  -> (same, via the app)
#
# Postgres is the existing `postgre_container` on this host (pgvector 15.4).
# We create a dedicated `astrobot` database/user on it — no other DB is touched.
# After `up`, connect the shared containers to this network (idempotent):
#     docker network connect astrobot_net postgre_container
#     docker network connect astrobot_net caddy
#
# Secrets come from `.env` next to this file (never committed).

services:
  astrobot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: astrobot
    image: astrobot:2.0.0

    # Published on the host so http://<host>:3000 works directly.
    # Caddy also reverse-proxies to it for HTTPS.
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_INTERNAL_URL=http://astrobot-admin:7040
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - N8N_WEBHOOK=${N8N_WEBHOOK}
      - HF_API_KEY=${HF_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

    networks:
      - astrobot_net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  astrobot-admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    container_name: astrobot-admin
    image: astrobot-admin:1.0.0

    expose:
      - "7040"

    environment:
      - NODE_ENV=production
      - PORT=7040
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Needed so the admin can seed / test the n8n fallback engine
      - N8N_WEBHOOK=${N8N_WEBHOOK}

    networks:
      - astrobot_net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7040/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  astrobot_net:
    name: astrobot_net
    driver: bridge
